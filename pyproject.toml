[project]
name = "scry-dosbox-x"
version = "0.1.0"
description = "Drive and debug a DOS program from your MCP client, live"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dosbox-x", "dos", "emulator", "debugger", "mcp"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Emulators",
]
dependencies = [
    # UPPER-BOUNDED on purpose: `MCPServer` is a 2.x API. Without the bound a future
    # 3.x installs cleanly and then fails at import, which is a broken install that
    # looks like a broken server.
    "mcp>=2.1.0,<3",
    # `disassemble`'s decoder: the debugger has no disassembly command, so x86 is decoded on
    # the host. Capstone because it ships one prebuilt wheel per platform this package runs on
    # (no native build) and hands over instruction groups and operand details, so a branch and
    # its target come from the decoder's fields, never from its text. Bounded like `mcp`: a
    # major version is a different API until somebody has measured it.
    "capstone>=5.0.9,<6",
    # What the Scry servers share (the reply contract, the probe, the live bench), pinned by
    # its release tag so a build reads exactly the core it was tested against.
    "scry-core @ git+https://github.com/scry-mcp/scry-core@v0.118.1",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
scry-dosbox-x = "scry_dosbox_x.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scry_dosbox_x"]

[tool.hatch.metadata]
# `scry-core` is pinned by its git tag, a direct reference hatchling refuses unless told.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# THE BAR IS SCRY-CORE'S: [tool.ruff] and [tool.mypy] below are its `pyproject.toml`'s own, and
# [tool.pytest.ini_options] is its base plus this repository's live tier and anchors.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "W"]
# N818 wants every exception renamed to `...Error`. The concept is called INVALID across every
# tool here (exit code 3, and the word the programs print), so the class that raises it is
# `Invalid`: one spelling per concept outranks a generic naming convention.
ignore = ["N818"]

[tool.mypy]
# NO PATH LIST: a hand-kept list of directories is always one short of the tree.
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The battery runs with a home and a temp folder of its own and fails on a file left in that
# home (`scry_core.private_run`); pytest removes a green run's base temp and keeps a failed one's.
private_run = true
tmp_path_retention_policy = "failed"
pythonpath = [".", "tools"]
# A TIER THAT LAUNCHES EMULATORS MAY NOT BE REACHED BY ACCIDENT: a stranger running `pytest` from
# a clone would otherwise launch an emulator per case. Opting in is explicit (`pytest -m live`),
# and a command-line `-m` beats this one.
markers = ["live: drives a REAL emulator; deselected by default, opt in with `-m live`",
           "windowed: opens a window, so a pooled live run keeps it out of the pool",
           "window: opens a window and may switch the owner's Space; opt in with `-m window`"]
# `--cov` IS HERE SO EVERY `pytest` JUDGES THE FLOOR: without the flag pytest-cov registers no
# plugin, and a bare run exits 0 having measured nothing. A partial run goes red on the floor by
# construction, because the floor is the whole repository's: a partial run is narrowed as
# CONTRIBUTING.md says (a bare `--cov` takes the path after it as its source).
addopts = "-m 'not live and not window' --cov"
# The shape guard (scry-core's `reply_shapes` plugin) wraps these: the contract every envelope goes
# through, and the MCP boundary whose `_summary` every reply crosses.
reply_shapes_anchors = ["scry_core.reply_contract", "scry_core.boundary"]

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]
source = ["."]
# The live tier runs against an emulator, never in the unit suite, which imports some of its files
# for the bookkeeping they share (the runners' end, the bench): measured, those would weigh the
# floor with sections only a live run executes. A demo's own `demo.py` is the live tier's too;
# what the demos share, `demos/host.py`, is plain logic and is measured.
omit = [".venv/*", "tests/live/*", "demos/*/*"]

[tool.coverage.report]
# THE FLOOR IS THE VENDOR'S: coverage.py's `fail_under`, judged by pytest-cov at the end of every
# `--cov` run. The number is the total the run that fixed it measured, raised by hand from a run.
# It counts lines EXECUTED, not asserted: what proves a test bites is having seen it red.
fail_under = 97.40
# A branch only Windows runs: the floor is judged on macOS, where no such line can execute.
exclude_also = ['if sys\.platform == "win32":']
precision = 2
show_missing = true
