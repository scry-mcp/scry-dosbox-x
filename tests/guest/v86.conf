# The config of the VM86 guest: it launches `V86.COM` from this directory, which leaves DOS for
# virtual-8086 mode and writes `V86 nnnn` lines on port 0xE9 there.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
# The guest's lines go to the Bochs port: without this the port is inert.
bochs debug port e9 = true

[dos]
# OFF: the guest enters protected mode by itself, so no memory manager of the emulator's may
# hold the machine first.
ems=false
xms=false

[cpu]
core=normal
cputype=pentium
cycles=fixed 10000

[autoexec]
mount c "."
c:
V86.COM
