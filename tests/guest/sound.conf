# The config of the sound guest: `SOUND.COM` from this directory, port E9 open, and the three
# devices it plays through at their defaults but the MIDI one, which has no synthesizer to reach:
# a capture records what the guest sent, not what a synthesizer made of it.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
bochs debug port e9 = true

[cpu]
core=normal
cputype=pentium
cycles=fixed 10000

[midi]
mpu401=uart
mididevice=none

[autoexec]
mount c "."
c:
SOUND.COM
