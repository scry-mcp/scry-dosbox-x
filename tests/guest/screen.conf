# The config of the screen guest, `SCREEN.COM`, a program with known answers for the screen
# tools (its header says what each stop shows).
#
# The machine is the probe's, so a reading taken here and one taken on `probe.conf` are the
# same hardware. What differs is the autoexec: it RUNS NOTHING. Every start passes
# `program="SCREEN.COM"`, which the emulator runs after this autoexec, and which is what a
# `capture_video` session needs to know what it records. Nor does it `exit`: a program given
# that way runs only once the autoexec has finished without leaving.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`: a capture writes a frame per retrace of the guest's own clock, and a
# dynamic clock would make which frame shows which step a lottery.
cycles=fixed 10000

[autoexec]
mount c "."
c:
