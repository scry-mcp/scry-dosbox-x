# The config of the DOS guest, `DOSIO.COM`, whose DOS calls, timer counter and output file are
# the known answers of the machine tools and the DOS channels (its header says what each is).
#
# The machine is the probe's, so the same hardware answers. The autoexec mounts and stops
# there: the guest runs as `start(program="DOSIO.COM W")`, the tail choosing the file it leaves,
# and is started from a scratch copy of this directory, since it writes OUT.TXT where it runs.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
bochs debug port e9 = true

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`, as every guest of this package runs.
cycles=fixed 10000

[autoexec]
mount c "."
c:
