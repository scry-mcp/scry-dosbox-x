# The config of the mouse guest, `MOUSE.COM`, which writes on E9 what the DOS mouse driver says
# (its header has the lines). The machine is the probe's. Its autoexec RUNS NOTHING: every start
# passes `program="MOUSE.COM"`, which the emulator runs after this autoexec and before which
# `start` loads the input stub, so this conf carries no stub line of its own. Nor does it
# `exit`: a program given that way runs only once the autoexec has finished without leaving.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
bochs debug port e9 = true

[cpu]
core=normal
cputype=pentium
cycles=fixed 10000

[autoexec]
mount c "."
c:
