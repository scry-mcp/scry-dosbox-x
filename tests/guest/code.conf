# The config of the code guest, `CODE.COM`, whose two `int 3` stops are the known answers of
# `disassemble`, the instruction a stop carries and `call_stack` (its header says what each
# stop holds).
#
# The machine is the probe's, so the same hardware answers. Port E9 is open because the guest
# writes which routine it entered there, and that log is what a walked call stack is held
# against. The autoexec runs the guest and nothing else: start it with `break_on_int3=True`
# and `resume` reaches the first stop.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
bochs debug port e9 = true

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`, as every guest of this package runs.
cycles=fixed 10000

[autoexec]
mount c "."
c:
CODE.COM
