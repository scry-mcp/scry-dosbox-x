# The config the live tier uses when the caller points it at nothing.
#
# It launches `PROBE.COM` from this directory, a 144-byte guest this package OWNS. The
# tier used to require somebody's private application, and on a machine without it NINE
# cases failed rather than skipped -- measured, same emulator and same config with one
# line changed. The dependency was never the project's name: it is that the guest RUNS
# after a `resume` and EMITS instrumentation, which is what `resume`, `e9`, `e9_wait`,
# `step`-on-a-running-machine and the bound cases all rest on.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
# Capture the guest's writes to the Bochs 0xE9 port. WITHOUT THIS THE PORT IS INERT and
# the instrumentation goes nowhere -- measured, `e9` then refuses with "no logfile",
# which reads as a defect in the session rather than a line missing from the config.
bochs debug port e9 = true

[dos]
# EMS AND XMS ON, because two cases prove the machine really ran by finding DOS's own
# `EMS page frame` / `XMS:` banner in a screen delta. Off, those lines never appear and
# the cases fail over a config line rather than over anything they test.
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`: these cases compare what the guest emitted against how long they
# waited, and a dynamic clock makes that a lottery.
cycles=fixed 10000

[autoexec]
mount c "."
c:
PROBE.COM
# UNREACHABLE, and deliberately present: `PROBE.COM` never returns, so this line never
# runs. It is here because the case that tests `start(program=...)` builds its config by
# STRIPPING the launch line and the `exit`, and REQUIRES both substitutions to match --
# a conf with only one of them is skipped as "not the shape this case patches", which is
# the right refusal and the wrong outcome for the package's own fixture.
exit
