# The config of the step guest, `STEP.COM`: one instruction of each kind a step has to get
# right, after one `int 3` stop (its header lists them and where each step lands).
#
# The machine is the probe's, so the same hardware answers. Start it with `break_on_int3=True`
# and the first `resume` reaches the stop.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
bochs debug port e9 = true

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`, as every guest of this package runs.
cycles=fixed 10000

[autoexec]
mount c "."
c:
STEP.COM
