# The config of the keys guest, `KEYS.COM`, which writes on E9 every scan byte INT 9 takes with
# the BIOS tick it arrived at (its header has the lines). The machine is the probe's. Its autoexec
# RUNS NOTHING: every start passes `program="KEYS.COM"`, which the emulator runs after this
# autoexec and before which `start` loads the input stub. The cell that starves the emulator
# passes a `-set "cpu cycles=..."` of its own.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
bochs debug port e9 = true

[cpu]
core=normal
cputype=pentium
cycles=fixed 10000

[autoexec]
mount c "."
c:
