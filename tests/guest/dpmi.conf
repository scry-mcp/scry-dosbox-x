# The conf the protected-mode guest runs under: `DPMI.EXE` is a DJGPP program, and its DPMI host
# is the CWSDPMI DOSBox-X provides, which the DJGPP stub finds on the PATH: nothing here mounts
# one. The session's cwd is this directory, which the mounts below are relative to.
#
# THE AUTOEXEC ENDS AT THE PROMPT: the program is typed by `start(program=...)`, which is what
# puts its command line on the shell's screen for the screen tools to find. Before it, the
# package's serial stub (`guest/INJECT.COM`, mounted as G:) loads when the session was started
# with an `input_port`, and says on E9 that the device is absent when it was not.

[sdl]
# ON, because the mouse is captured by a click, and the case that sends one counts the click
# the emulator swallows to capture it.
autolock=true

[dosbox]
# An S3 with VBE 2.0, for the linear frame buffer the guest switches to.
machine=svga_s3
memsize=16
bochs debug port e9 = true

[cpu]
# The DYNAMIC core, as a program's own conf usually has it: a trace is refused on it, and a
# case that needs the normal core says so with its own flags.
core=dynamic
cputype=pentium
# FIXED, never `max`: a run's E9 lines are compared against how long it was given.
cycles=fixed 100000

[dos]
xms=true
ems=true

[autoexec]
# READ-ONLY, because CWSDPMI writes its swap file to C:\ and this is the package's tree; D: is the
# same directory again, so the file argument the guest reads comes off a second drive.
mount c "." -ro
mount d "." -ro
mount g "../../guest"
c:
G:\INJECT.COM
