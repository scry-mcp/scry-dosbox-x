# The config of the LineUp demo: the PC port as its own run conf boots it (a VGA card, a Sound
# Blaster 16 where the game's `BLASTER` line says), after the server's input stub. The demo writes
# the stub's directory in for @GUEST@, since the emulator runs from the reader's copy of the game.

[sdl]
autolock=false
# The 320 x 200 screen drawn four times over, so whoever watches sees the board, not a stamp.
output=opengl
windowresolution=1280x800

[render]
scaler=none
aspect=false

[dosbox]
machine=vgaonly
memsize=16
bochs debug port e9 = true

[dos]
xms=false
ems=false
umb=false
ver=5.0

[cpu]
# NORMAL, never dynamic: the dynamic core runs the code it has compiled without asking the
# debugger, so a breakpoint inside a compiled block is passed over and a run to a routine never
# arrives. FIXED, never `max`, at the clock the game's own goldens are judged at, so the same
# keys reach the same frames and the music records the same samples on every run.
core=normal
cputype=486
cycles=fixed 50000

[sblaster]
sbtype=sb16
sbbase=220
irq=5
dma=1
hdma=5

[autoexec]
mount c "."
mount g "@GUEST@"
G:\SCRY.COM
c:
set BLASTER=A220 I5 D1 H5 T6
EXES\LINEUP.EXE
