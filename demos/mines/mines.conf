# The config of the Minesweeper demo: this directory as C:, ready for `MINES.COM`. The server's
# `start` loads its input stub and then the game (`program`), which is what lets the session
# record itself. By hand, type MINES at the prompt.
#
# The machine is the live tier's, with a Sound Blaster 16 where the game's `BLASTER` line says.

[sdl]
# OFF: the mouse goes in inside the guest, so the window never has to capture the host's.
autolock=false
# The 800 x 600 screen drawn at seven quarters, so whoever watches sees the board, not a stamp.
output=opengl
windowresolution=1400x1050

[dosbox]
# An S3 card: its VBE BIOS has mode 103h, 800 x 600 in 256 colours.
machine=svga_s3
memsize=16
# The game reports every reveal, flag and screen on the Bochs port 0xE9.
bochs debug port e9 = true

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`: the game is paced by the vertical retrace, and a fixed clock is what makes
# the same click open the same cells and sound the same samples on every run.
cycles=fixed 40000

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[autoexec]
mount c "."
c:
set BLASTER=A220 I7 D1 H5 T6
