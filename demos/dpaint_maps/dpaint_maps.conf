# The config of the Deluxe Paint screen-map demo. It runs from your own copy's directory (the
# demo's `--cwd`) and mounts that as C:; the server's `start` loads the input stub and then starts
# `DP.EXE k`, which skips the screen-format menu straight into VGA, 640 x 480 in 16 colours
# (mode 12h, four bit planes).
#
# The machine is the live tier's (`tests/guest/probe.conf`), so the demo runs on the hardware
# the server's own tests run on.

[sdl]
# OFF: the mouse goes in inside the guest, so the window never has to capture the host's.
autolock=false
# A window big enough to watch the menus open: 640 x 480 scaled by two, which a scaling output
# draws and `surface` would not.
output=opengl
windowresolution=1280x960

[dosbox]
machine=svga_s3
memsize=16
# Deluxe Paint writes nothing there; the input stub announces itself on it, and the demo reads
# that line to know the build moves the pointer with motion the program can see.
bochs debug port e9 = true

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`: every input lands a retrace apart on a stopped machine, and a held button
# repeats by the guest's own clock, so a fixed clock is what makes the same retrace show the
# same picture on every run.
cycles=fixed 10000

[autoexec]
mount c "."
c:
