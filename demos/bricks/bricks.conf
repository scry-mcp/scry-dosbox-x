# The config of the bricks demo: it boots straight into `BRICKS.COM` from this directory, after
# the server's input stub, which the autoexec runs first because it runs the game itself.
#
# The machine is the live tier's (`tests/guest/probe.conf`), so the demo runs on the hardware
# the server's own tests run on.

[sdl]
# OFF: the mouse goes in inside the guest, so the window never has to capture the host's.
autolock=false

[dosbox]
machine=svga_s3
memsize=16
# The game reports every hit, key and life lost on the Bochs port 0xE9; without this line the
# port is inert and those lines go nowhere.
bochs debug port e9 = true

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`: the game is paced by the vertical retrace, and a fixed clock is what
# makes the same frame show the same picture on every run.
cycles=fixed 10000

[autoexec]
mount c "."
mount g "../../guest"
G:\INJECT.COM
c:
BRICKS.COM
