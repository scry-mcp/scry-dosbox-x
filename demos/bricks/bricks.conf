# The config of the bricks demo: it boots straight into `BRICKS.COM` from this directory.
#
# The machine is the live tier's (`tests/guest/probe.conf`), so the demo runs on the hardware
# the server's own tests run on.

[sdl]
# ON: the click that takes the mouse is also the one that captures it, so the pointer's motion
# reaches the game only once somebody has clicked in the window.
autolock=true

[dosbox]
machine=svga_s3
memsize=16
# The game reports every hit, key and life lost on the Bochs port 0xE9; without this line the
# port is inert and those lines go nowhere.
bochs debug port e9 = true

[dos]
ems=true
xms=true

[cpu]
core=normal
cputype=pentium
# FIXED, never `max`: the game is paced by the vertical retrace, and a fixed clock is what
# makes the same frame show the same picture on every run.
cycles=fixed 10000

[autoexec]
mount c "."
c:
BRICKS.COM
