# The config of the X-COM Apocalypse demo. The demo writes it into the run's own directory with
# the two paths filled in, and starts DOSBox-X in the reader's copy of the game: C: is that copy
# with an overlay in the run's directory over it, so what the game writes (DOS/4GW's swap file,
# its options) lands there and never in the copy; D: is the game's CD image, as the game's own
# installer leaves it. The server's `start` loads the input stub, then runs XCOMAPOC.EXE.

[sdl]
# OFF: the mouse goes in inside the guest, so the window never has to capture the host's.
autolock=false

[dosbox]
machine=svga_s3
memsize=64
# The input stub announces itself on the E9 port; without it no key reaches the game.
bochs debug port e9 = true

[cpu]
# The dynamic core and a fixed clock: the game is a 32-bit DOS/4GW program that needs the speed,
# and a fixed clock keeps two runs alike where cycles=max would follow the host's load.
core=dynamic
cputype=pentium
cycles=fixed 60000

[dos]
# The game asks for its files by 8.3 names: long names off, so the DOS calls the demo reads
# carry the names the game wrote.
ver=7.1
lfn=false

[autoexec]
mount c "@GAME@"
mount -t overlay c "@OVERLAY@"
imgmount d "cd/X-COM Apocalypse.iso" -t cdrom
c:
cd \XCOMA
