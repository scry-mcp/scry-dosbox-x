# The config of the Monkey Island demo. The demo writes it into the run's own directory with
# @CD@ (the reader's CUE sheet) and @RUN@ (that directory) filled in: the disc goes in as D:,
# audio tracks and all, and C: is the run's directory, so nothing the game writes lands in the
# reader's copy. The server's `start` loads the input stub and then starts `D:\MONKEY.COM`, the
# disc's language menu.

[sdl]
# OFF: the mouse goes in inside the guest, so the window never has to capture the host's.
autolock=false
# The 320 x 200 game scaled by four, so the island reads from across the room.
output=opengl
windowresolution=1280x800

[dosbox]
machine=svga_s3
memsize=16
bochs debug port e9 = true

[dos]
ems=true
xms=true

[mixer]
# The CD's own rate, so its Red Book samples reach a recording without being resampled and a
# recording can be held to the bytes on the reader's disc.
rate=44100

# Nothing sounds but the CD: with a Sound Blaster, an OPL or the speaker the game lays its
# effects over the music, and the recording could no longer be held to the disc's samples.
[sblaster]
sbtype=none
oplmode=none

[speaker]
pcspeaker=false

[cpu]
core=normal
cputype=486
# FIXED, never `max`: every click lands a retrace apart on a stopped machine, and the mixer keeps
# every block of the CD's audio only while the host holds the guest's clock.
cycles=fixed 20000

[autoexec]
mount c "@RUN@"
imgmount d "@CD@" -t cdrom
c:
